name: bonsai_flutter_host_navigation_example
description: Typed host effects and OCaml-owned declarative navigation.
publish_to: none
version: 0.0.0

environment:
  sdk: ^3.12.2
  flutter: ">=3.44.0"

hooks:
  user_defines:
    bonsai_flutter_native:
      # bonsai-flutter:begin native-hook
      native_artifact_root: ../_build/bonsai-flutter/artifacts/
      macos_deployment_target: '26.0'
      ios_deployment_target: '15.0'
      require_ocaml_backend: true
      # bonsai-flutter:end native-hook

dependencies:
  # bonsai-flutter:begin packages
  bonsai_flutter:
    path: ../.bonsai-flutter/flutter-packages/bonsai_flutter
  # bonsai-flutter:end packages
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
