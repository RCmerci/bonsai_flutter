name: bonsai_flutter_sqlite_worker_example
description: Test-first scaffold for the SQLite Worker Todo example.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.12.2
  flutter: ">=3.44.0"

hooks:
  user_defines:
    bonsai_flutter_native:
      # bonsai-flutter:begin native-hook
      native_artifact_root: ../_build/bonsai-flutter/artifacts/
      macos_deployment_target: '26.0'
      ios_deployment_target: '15.0'
      require_ocaml_backend: true
      link_system_sqlite3: true
      # bonsai-flutter:end native-hook

dependencies:
  # bonsai-flutter:begin packages
  bonsai_flutter:
    path: ../.bonsai-flutter/flutter-packages/bonsai_flutter
  # bonsai-flutter:end packages
  flutter:
    sdk: flutter
  material_ui: 1.1.1
  path: ^1.9.1
  path_provider: ^2.1.5

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
