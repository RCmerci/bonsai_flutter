name: bonsai_flutter_host_effects_example
description: Typed OCaml-owned host effects example.
publish_to: none
version: 0.0.0

environment:
  sdk: ^3.12.2
  flutter: ">=3.44.0"

hooks:
  user_defines:
    bonsai_flutter_native:
      ocaml_complete_object: ../../../_build/default/examples/host_effects/ocaml/native_embed.exe.o

dependencies:
  bonsai_flutter:
    path: ../../../flutter/packages/bonsai_flutter
  bonsai_flutter_native:
    path: ../../../flutter/packages/bonsai_flutter_native
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
