name: bonsai_flutter_text_input_example
description: Revisioned text input example with OCaml-owned canonical state.
publish_to: none
version: 0.0.0

environment:
  sdk: ^3.12.2
  flutter: ">=3.44.0"

hooks:
  user_defines:
    bonsai_flutter_native:
      native_artifact_root: ../../../_build/native-artifacts/text_input/
      ios_deployment_target: '15.0'
      require_ocaml_backend: true

dependencies:
  bonsai_flutter:
    path: ../../../flutter/packages/bonsai_flutter
  bonsai_flutter_native:
    path: ../../../flutter/packages/bonsai_flutter_native
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
