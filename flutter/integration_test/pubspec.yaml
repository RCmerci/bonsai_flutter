name: bonsai_flutter_integration_test
description: End-to-end native integration tests for bonsai_flutter.
publish_to: none
version: 0.0.0

environment:
  sdk: ^3.12.2
  flutter: ">=3.44.0"

hooks:
  user_defines:
    bonsai_flutter_native:
      native_artifact_root: ../../_build/native-artifacts/integration_test/
      macos_deployment_target: '26.0'
      ios_deployment_target: '15.0'
      require_ocaml_backend: true
      link_system_sqlite3: true

dependencies:
  bonsai_flutter:
    path: ../packages/bonsai_flutter
  bonsai_flutter_native:
    path: ../packages/bonsai_flutter_native
  flutter:
    sdk: flutter
  bonsai_flutter_sqlite_worker_example:
    path: ../../examples/sqlite_worker/flutter
  path: ^1.9.1
  path_provider: ^2.1.5

dev_dependencies:
  flutter_driver:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  test: ^1.31.0

flutter:
  uses-material-design: true
