name: iOS arm64

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-audit-and-integrate:
    runs-on: macos-26
    timeout-minutes: 180
    env:
      OCAMLPARAM: "_,keywords=4.14"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.3.0
          opam-repositories: |
            janestreet-bleeding-external: git+https://github.com/janestreet/opam-repository.git#a577fc24cba311814e5088a0f6851c65b5cf8dc1
            janestreet-bleeding: git+https://github.com/janestreet/opam-repository.git#6789b91abef324f0f9dc2a07332afc4843c7dbe5
            default: https://opam.ocaml.org
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          architecture: arm64
          cache: true
      - name: Assert the measured Xcode baseline
        run: |
          test "$(xcodebuild -version | sed -n '1s/^Xcode //p')" = "26.1.1"
          test "$(uname -m)" = "arm64"
      - name: Build and audit iOS artifacts
        run: make ci-ios
