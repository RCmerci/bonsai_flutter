name: iOS physical device

on:
  workflow_dispatch:
  push:
    branches:
      - main
  merge_group:

permissions:
  contents: read

concurrency:
  group: ios-device-hardware
  cancel-in-progress: false

jobs:
  signed-device-matrix:
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, macOS, arm64, ios-device]
    environment: ios-device
    timeout-minutes: 180
    env:
      IOS_DEVICE_ID: ${{ secrets.IOS_DEVICE_ID }}
      IOS_DEVELOPMENT_TEAM: ${{ secrets.IOS_DEVELOPMENT_TEAM }}
      IOS_BUNDLE_IDENTIFIER: ${{ secrets.IOS_BUNDLE_IDENTIFIER }}
      IOS_DEVELOPMENT_PROFILE_SPECIFIER: ${{ secrets.IOS_DEVELOPMENT_PROFILE_SPECIFIER }}
      IOS_DISTRIBUTION_PROFILE_SPECIFIER: ${{ secrets.IOS_DISTRIBUTION_PROFILE_SPECIFIER }}
      IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
      IOS_DEVELOPMENT_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_DEVELOPMENT_CERTIFICATE_P12_BASE64 }}
      IOS_DEVELOPMENT_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DEVELOPMENT_CERTIFICATE_PASSWORD }}
      IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_P12_BASE64 }}
      IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
      IOS_DEVELOPMENT_PROFILE_BASE64: ${{ secrets.IOS_DEVELOPMENT_PROFILE_BASE64 }}
      IOS_DISTRIBUTION_PROFILE_BASE64: ${{ secrets.IOS_DISTRIBUTION_PROFILE_BASE64 }}
      IOS_EXPORT_OPTIONS_PLIST_BASE64: ${{ secrets.IOS_EXPORT_OPTIONS_PLIST_BASE64 }}
    steps:
      - name: Check out reviewed repository state
        uses: actions/checkout@v6
      - name: Assert pinned tools
        run: |
          test "$(xcodebuild -version | sed -n '1s/^Xcode //p')" = "26.1.1"
          test "$(flutter --version --machine | jq -r .frameworkVersion)" = "3.44.8"
          test "$(uname -m)" = "arm64"
      - name: Install repository-external signing material
        run: tool/ci/install_ios_signing.sh install
      - name: Run signed physical-device matrix
        run: make ci-ios-device
      - name: Remove signing material
        if: always()
        run: tool/ci/install_ios_signing.sh cleanup
