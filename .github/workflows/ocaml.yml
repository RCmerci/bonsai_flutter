name: OCaml

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ocaml-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OCAMLPARAM: "_,keywords=4.14"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.3.0
          opam-repositories: |
            janestreet-bleeding-external: git+https://github.com/janestreet/opam-repository.git#a577fc24cba311814e5088a0f6851c65b5cf8dc1
            janestreet-bleeding: git+https://github.com/janestreet/opam-repository.git#6789b91abef324f0f9dc2a07332afc4843c7dbe5
            default: https://opam.ocaml.org
      - name: Verify CI contract
        run: make ci-contract
      - name: Build and test OCaml
        run: make ci-ocaml
